name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      ui_test:
        description: Run UI tests
        type: boolean
        default: false

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    env:
      CODESIGN_IDENTITY: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: ./build_and_run.sh --build

      - name: Test
        run: ./build_and_run.sh --test

      - name: Zip app
        run: ditto -c -k --keepParent DualPDFReader.app DualPDFReader.app.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DualPDFReader-macos
          path: DualPDFReader.app.zip
          if-no-files-found: error

  ui-test:
    name: UI test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_test == true }}
    runs-on: macos-latest
    env:
      CODESIGN_IDENTITY: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: UI test
        run: ./build_and_run.sh --ui-test
