<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>__WORKSPACE_CSS__</style>
</head>
<body>

<div id="workspace" class="workspace">
    <!-- 1. Left Sidebar (Collection Tree) -->
    <aside class="sidebar">
        <div class="sidebar-toolbar">
            <label class="sidebar-category-search" for="categorySearchInput" title="搜索左侧分类">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                    <circle cx="6.8" cy="6.8" r="4.8"/>
                    <path d="M10.4 10.4L14 14"/>
                </svg>
                <input type="search" id="categorySearchInput" placeholder="搜索分类" aria-label="搜索分类" autocomplete="off">
            </label>
        </div>
        <div class="sidebar-scroll" id="sidebarScroll"></div>
    </aside>

    <!-- 2. Center Main Area (Clean Paper List) -->
    <main class="center-pane">
        <header class="center-header">
            <div class="header-left">
                <button class="btn-primary" onclick="openCreatePaperModal()" style="height:32px; padding:0 14px; font-size:13.5px; border-radius:6px; display:inline-flex; align-items:center; gap:6px;">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M8 3v10M3 8h10"/>
                    </svg>
                    <span>导入论文</span>
                </button>
                <div class="header-title-wrap">
                    <span class="header-lib-title" id="currentViewTitle">我的文库</span>
                    <span class="header-item-count" id="currentViewCount">0 篇文献</span>
                </div>
            </div>

            <div class="header-controls">
                <div class="search-box zotero-search-box">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        <circle cx="6.5" cy="6.5" r="4.5"/>
                        <path d="M10 10l3.5 3.5"/>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="所有字段和标签">
                    <button class="search-funnel-btn" onclick="openSortAndViewMenu(event)" title="排序选项">
                        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round">
                            <path d="M1.5 2.5h13l-5 5.8v4.7l-3 1.5V8.3L1.5 2.5z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        <div class="center-content" id="centerContent"></div>
    </main>
</div>

<!-- Create / Import Paper Modal -->
<div class="modal-backdrop" id="createModal">
    <div class="modal-dialog">
        <h3 class="modal-title">导入论文</h3>
        <div class="modal-tabs">
            <button class="modal-tab-btn active" id="modalTabLocal" onclick="switchModalTab('local')">本地 PDF</button>
            <button class="modal-tab-btn" id="modalTabArxiv" onclick="switchModalTab('arxiv')">arXiv 导入</button>
        </div>

        <!-- Mode A: Upload Local PDF -->
        <div id="modalLocalSection">
            <input type="hidden" id="mLocalArxivId" value="">
            <div style="display:flex; gap:8px; margin-bottom:14px;">
                <button class="btn-primary" style="flex:1; justify-content:center; height:38px;" onclick="sendBridge({action:'pickModalPDFs', mode:'both'})">
                    选择 PDF 文件…
                </button>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
                <div class="pdf-slot-card" style="cursor:pointer;" onclick="sendBridge({action:'pickModalPDFs', mode:'original'})">
                    <div class="pdf-slot-label">原版 PDF</div>
                    <div class="pdf-slot-meta" id="modalOrigStatus">未选择</div>
                </div>
                <div class="pdf-slot-card" style="cursor:pointer;" onclick="sendBridge({action:'pickModalPDFs', mode:'translated'})">
                    <div class="pdf-slot-label">中文译版</div>
                    <div class="pdf-slot-meta" id="modalTransStatus">未选择</div>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-full">
                    <label class="form-label">论文标题</label>
                    <input type="text" id="mTitle" class="form-control" placeholder="留空自动提取">
                </div>
                <div class="form-full">
                    <label class="form-label">作者</label>
                    <input type="text" id="mAuthors" class="form-control">
                </div>
                <div>
                    <label class="form-label">发表年份</label>
                    <input type="text" id="mYear" class="form-control" value="2025">
                </div>
                <div>
                    <label class="form-label">期刊 / 会议 / 来源</label>
                    <input type="text" id="mVenue" class="form-control" value="arXiv">
                </div>
                <div>
                    <label class="form-label">所属分类合集</label>
                    <input type="text" id="mCategory" class="form-control" value="大模型架构 (LLM)">
                </div>
                <div>
                    <label class="form-label">标签</label>
                    <input type="text" id="mTags" class="form-control" placeholder="MoE, MLA, RL">
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
                <button class="btn-secondary" onclick="closeCreatePaperModal()">取消</button>
                <button class="btn-primary" onclick="submitCreatePaperModal()">创建并双栏打开</button>
            </div>
        </div>

        <!-- Mode B: Input ArXiv ID -->
        <div id="modalArxivSection" style="display:none;">
            <div class="form-grid" style="margin-bottom:16px;">
                <div class="form-full">
                    <label class="form-label">arXiv ID 或网页链接</label>
                    <input type="text" id="mArxivInput" class="form-control" placeholder="1706.03762 或 https://arxiv.org/abs/1706.03762">
                </div>
                <div class="form-full">
                    <label class="form-label">所属分类合集</label>
                    <input type="text" id="mArxivCategory" class="form-control" value="大模型架构 (LLM)">
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn-secondary" onclick="closeCreatePaperModal()">取消</button>
                <button class="btn-primary" id="btnSubmitArxiv" onclick="submitArxivImportModal()">导入</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Paper Metadata Modal -->
<div class="modal-backdrop" id="editMetaModal">
    <div class="modal-dialog">
        <h3 class="modal-title">编辑元数据</h3>
        <input type="hidden" id="editPaperId">
        <div class="form-grid">
            <div class="form-full">
                <label class="form-label">论文标题</label>
                <input type="text" id="editTitle" class="form-control">
            </div>
            <div class="form-full">
                <label class="form-label">作者</label>
                <input type="text" id="editAuthors" class="form-control">
            </div>
            <div>
                <label class="form-label">发表年份</label>
                <input type="text" id="editYear" class="form-control">
            </div>
            <div>
                <label class="form-label">期刊 / 出版来源</label>
                <input type="text" id="editVenue" class="form-control">
            </div>
            <div class="form-full">
                <label class="form-label">arXiv ID</label>
                <input type="text" id="editArxivId" class="form-control">
            </div>
            <div>
                <label class="form-label">所属分类合集</label>
                <input type="text" id="editCategory" class="form-control">
            </div>
            <div>
                <label class="form-label">标签</label>
                <input type="text" id="editTags" class="form-control">
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
            <button class="btn-secondary" style="color:var(--accent);" onclick="triggerRefreshMetaInModal()">重新拉取 arXiv 元数据</button>
            <div style="display:flex; gap:8px;">
                <button class="btn-secondary" onclick="closeEditMetaModal()">取消</button>
                <button class="btn-primary" onclick="submitEditMetaModal()">保存修改</button>
            </div>
        </div>
    </div>
</div>

<!-- Custom Right-Click / Dropdown Context Menu -->
<div class="ctx-menu" id="ctxMenu"></div>

<!-- Drag & Drop Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card" id="dragOverlayText">
        导入 PDF 文件
    </div>
</div>

<script>__WORKSPACE_JS__</script>
</body>
</html>
