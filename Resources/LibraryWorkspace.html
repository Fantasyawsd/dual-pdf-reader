<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>__WORKSPACE_CSS__</style>
</head>
<body>

<div id="workspace" class="workspace">
    <!-- 1. Left Sidebar (Zotero 7 Collection Tree + Bottom Tag Selector) -->
    <aside class="sidebar">
        <div class="sidebar-toolbar">
            <button class="zotero-icon-btn" onclick="openCreatePaperModal()" title="新建分类或导入论文 (⌘N)">
                <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.2l1.5 1.8H13A1.5 1.5 0 0 1 14.5 5.3v7.2A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5V3.5z"/>
                    <path d="M8 6.8v4.4M5.8 9h4.4"/>
                </svg>
            </button>
            <button class="zotero-icon-btn" onclick="window.focusLibrarySearch()" title="搜索文库 (⌘F)">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                    <circle cx="6.8" cy="6.8" r="4.8"/>
                    <path d="M10.4 10.4L14 14"/>
                </svg>
            </button>
        </div>
        <div class="sidebar-scroll" id="sidebarScroll"></div>
        <div class="tag-panel" id="tagPanel"></div>
    </aside>

    <!-- 2. Center Main Area (Zotero 7 Action Toolbar + Multi-Column Item Table) -->
    <main class="center-pane">
        <header class="center-header">
            <div class="header-left zotero-toolbar-left">
                <button class="zotero-tool-btn" onclick="openCreatePaperModal()" title="新建或导入双语论文 PDF (⌘N)">
                    <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3.5 1.5h6l3 3v10h-9v-13z"/>
                        <path d="M9.5 1.5v3h3"/>
                        <path d="M8 7v4M6 9h4"/>
                    </svg>
                    <span class="tool-caret">▾</span>
                </button>
                <button class="zotero-tool-btn" onclick="triggerAutoExtractSelected()" title="从 PDF 自动识别标题、作者与年份">
                    <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2.5 13.5L11 5l2.5 2.5-8.5 8.5-2.5-2.5z"/>
                        <path d="M9.5 6.5l2 2"/>
                        <path d="M13 1.5v2M12 2.5h2M3.5 2v1.5M2.75 2.75h1.5"/>
                    </svg>
                </button>
                <button class="zotero-tool-btn" onclick="openAttachmentQuickMenu(event)" title="向选中论文添加/替换原版、中文译版或附加 PDF">
                    <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 1.5h5.5l2.5 2.5v4.5"/>
                        <path d="M3 1.5v12h5"/>
                        <circle cx="11.5" cy="11.5" r="3"/>
                        <path d="M11.5 10v3M10 11.5h3"/>
                    </svg>
                    <span class="tool-caret">▾</span>
                </button>
                <button class="zotero-tool-btn" onclick="openNoteQuickMenu(event)" title="开启左栏论文+右栏笔记 (左文右记) 或查看全局笔记">
                    <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2.5" y="1.5" width="10" height="13" rx="1.2"/>
                        <path d="M5 5h5M5 8h5M5 11h3"/>
                    </svg>
                    <span class="tool-caret">▾</span>
                </button>
            </div>

            <div class="header-controls">
                <div class="search-box zotero-search-box">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        <circle cx="6.5" cy="6.5" r="4.5"/>
                        <path d="M10 10l3.5 3.5"/>
                    </svg>
                    <span class="search-caret">▾</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="所有字段和标签">
                    <button class="search-funnel-btn" onclick="openSortAndViewMenu(event)" title="排序选项">
                        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round">
                            <path d="M1.5 2.5h13l-5 5.8v4.7l-3 1.5V8.3L1.5 2.5z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        <div class="center-content" id="centerContent" onclick="handleCenterBlankClick(event)"></div>
    </main>

    <!-- 3. Right Zotero 7 Inspector Pane -->
    <aside class="inspector" id="inspectorPane">
        <div class="inspector-header" id="inspectorHeader" style="display:none;">
            <div class="inspector-tabs">
                <button class="insp-tab active" id="inspTab0" onclick="setInspectorTab(0)">信息与文档</button>
                <button class="insp-tab" id="inspTab1" onclick="setInspectorTab(1)">笔记 <span id="inspNoteCount"></span></button>
                <button class="insp-tab" id="inspTab2" onclick="setInspectorTab(2)">关联 <span id="inspRelCount"></span></button>
            </div>
        </div>
        <div class="inspector-body" id="inspectorBody"></div>
    </aside>

    <!-- 4. Far-Right Zotero 7 Vertical Icon Rail -->
    <aside class="zotero-right-rail" id="rightRail">
        <button class="rail-btn rail-top-btn" onclick="toggleInspectorPane()" title="展开 / 折叠右侧栏">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#555" stroke-width="1.3">
                <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
                <path d="M6 2.5v11"/>
                <path d="M3.2 5.2h1.5M3.2 7.8h1.5M3.2 10.4h1.5"/>
            </svg>
        </button>

        <div class="rail-group">
            <button class="rail-btn" id="railBtnInfo" onclick="activateInspectorSection('info')" title="条目信息与元数据">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#4A78D0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 1.5h6l3.5 3.5v9.5H3v-13z"/>
                    <path d="M9 1.5v3.5h3.5"/>
                    <circle cx="11.5" cy="11.5" r="3.2" fill="#F5F5F5" stroke="#4A78D0" stroke-width="1.2"/>
                    <path d="M11.5 10.8v2M11.5 9.6h.01"/>
                </svg>
            </button>
            <button class="rail-btn" id="railBtnAbstract" onclick="activateInspectorSection('actions')" title="双栏阅读与阅读状态">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#5B9BF8" stroke-width="1.3" stroke-linecap="round">
                    <rect x="2" y="3" width="12" height="10" rx="1.5"/>
                    <path d="M4.5 6h4M4.5 8.5h7M4.5 10.8h5"/>
                </svg>
            </button>
            <button class="rail-btn" id="railBtnPDFs" onclick="activateInspectorSection('pdfs')" title="PDF 附件与论文集文档">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#4CAF50" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13.2 7.3l-5.6 5.6a3.5 3.5 0 0 1-5-5l5.8-5.8a2.3 2.3 0 0 1 3.3 3.3L6 11.1a1.2 1.2 0 0 1-1.7-1.7l5.1-5.1"/>
                </svg>
            </button>
            <button class="rail-btn" id="railBtnNotes" onclick="activateInspectorSection('notes')" title="精读笔记与高亮批注">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#EAB308" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 1.5h10v9.5L9.5 14.5H3v-13z"/>
                    <path d="M9.5 11v3.5M5.2 5h5.6M5.2 8h4"/>
                </svg>
            </button>
            <button class="rail-btn" id="railBtnCollection" onclick="activateInspectorSection('collection')" title="所属文库与分类合集">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#3898A6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 6h12M3 6v6.5M6.3 6v6.5M9.7 6v6.5M13 6v6.5M1.5 12.5h13M8 2L1.5 6h13L8 2z"/>
                </svg>
            </button>
            <button class="rail-btn" id="railBtnTags" onclick="activateInspectorSection('tags')" title="论文标签">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#E07A47" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 8.2V2.5h5.7l6.3 6.3-5.7 5.7L2 8.2z"/>
                    <circle cx="5.2" cy="5.2" r="1" fill="#E07A47"/>
                </svg>
            </button>
            <button class="rail-btn" id="railBtnRelated" onclick="activateInspectorSection('related')" title="相关条目与外部链接">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#D98A6C" stroke-width="1.35" stroke-linecap="round">
                    <path d="M6.8 9.2a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-1.1 1.1"/>
                    <path d="M9.2 6.8a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l1.1-1.1"/>
                </svg>
            </button>
            <button class="rail-btn" onclick="openSelectedPaperIfAny(event)" title="双栏打开当前选中论文">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="8" cy="8" r="5.5"/>
                    <path d="M6 8h4M8.5 6l2 2-2 2"/>
                </svg>
            </button>
        </div>
    </aside>
</div>

<!-- Create / Import Paper Modal -->
<div class="modal-backdrop" id="createModal">
    <div class="modal-dialog">
        <h3 class="modal-title">创建条目 / 导入论文</h3>
        <div class="modal-tabs">
            <button class="modal-tab-btn active" id="modalTabLocal" onclick="switchModalTab('local')">📁 直接上传 PDF (自动识别)</button>
            <button class="modal-tab-btn" id="modalTabArxiv" onclick="switchModalTab('arxiv')">🌐 输入 arXiv ID / 链接</button>
        </div>

        <!-- Mode A: Upload Local PDF -->
        <div id="modalLocalSection">
            <p class="modal-sub">支持上传 PDF 文件，系统优先解析 arXiv ID 并在联网时拉取官方元数据与引用数，否则通过内置引擎极速提取。</p>
            <div style="display:flex; gap:8px; margin-bottom:14px;">
                <button class="btn-primary" style="flex:1; justify-content:center; height:38px;" onclick="sendBridge({action:'pickModalPDFs', mode:'both'})">
                    选择 1 或 2 个 PDF 文件 (自动配对中英版本)…
                </button>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
                <div class="pdf-slot-card" style="cursor:pointer;" onclick="sendBridge({action:'pickModalPDFs', mode:'original'})">
                    <div class="pdf-slot-label">原版 PDF (Original EN)</div>
                    <div class="pdf-slot-meta" id="modalOrigStatus">点击单独选择文件…</div>
                </div>
                <div class="pdf-slot-card" style="cursor:pointer;" onclick="sendBridge({action:'pickModalPDFs', mode:'translated'})">
                    <div class="pdf-slot-label">中文译版 (Translated ZH)</div>
                    <div class="pdf-slot-meta" id="modalTransStatus">点击单独选择文件…</div>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-full">
                    <label class="form-label">论文标题 (留空自动从 PDF 提取)</label>
                    <input type="text" id="mTitle" class="form-control" placeholder="例如：Attention Is All You Need">
                </div>
                <div class="form-full">
                    <label class="form-label">作者</label>
                    <input type="text" id="mAuthors" class="form-control" placeholder="例如：Ashish Vaswani, Noam Shazeer">
                </div>
                <div>
                    <label class="form-label">发表年份</label>
                    <input type="text" id="mYear" class="form-control" value="2025">
                </div>
                <div>
                    <label class="form-label">期刊 / 会议 / 来源</label>
                    <input type="text" id="mVenue" class="form-control" value="arXiv">
                </div>
                <div>
                    <label class="form-label">所属分类合集</label>
                    <input type="text" id="mCategory" class="form-control" value="大模型架构 (LLM)">
                </div>
                <div>
                    <label class="form-label">标签 (用逗号分隔)</label>
                    <input type="text" id="mTags" class="form-control" placeholder="MoE, MLA, RL">
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
                <button class="btn-secondary" onclick="closeCreatePaperModal()">取消</button>
                <button class="btn-primary" onclick="submitCreatePaperModal()">创建并双栏打开</button>
            </div>
        </div>

        <!-- Mode B: Input ArXiv ID -->
        <div id="modalArxivSection" style="display:none;">
            <p class="modal-sub">输入论文的 arXiv ID (如 1706.03762v7) 或论文链接，系统将自动拉取官方元数据与引用数，下载 PDF 并创建以论文名命名的条目。</p>
            <div class="form-grid" style="margin-bottom:16px;">
                <div class="form-full">
                    <label class="form-label">arXiv ID 或论文网页链接</label>
                    <input type="text" id="mArxivInput" class="form-control" placeholder="例如：1706.03762 或 https://arxiv.org/abs/1706.03762v7">
                </div>
                <div class="form-full">
                    <label class="form-label">所属分类合集</label>
                    <input type="text" id="mArxivCategory" class="form-control" value="大模型架构 (LLM)">
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn-secondary" onclick="closeCreatePaperModal()">取消</button>
                <button class="btn-primary" id="btnSubmitArxiv" onclick="submitArxivImportModal()">解析元数据并下载创建</button>
            </div>
        </div>
    </div>
</div>

<!-- Custom Right-Click / Dropdown Context Menu -->
<div class="ctx-menu" id="ctxMenu"></div>

<!-- Drag & Drop Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card" id="dragOverlayText">
        释放 PDF 文件即可智能识别中英双栏并导入文献库
    </div>
</div>

<script>__WORKSPACE_JS__</script>
</body>
</html>
